name: Check Broken Links (non-blocking)

on:
  push:
    branches: [ antora ]
  pull_request:
    branches: [ antora ]
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # adoc-link-checker (CLI `adocx`) : https://github.com/dhrions/adoc-link-checker
      - name: Install adoc-link-checker
        run: pip install adoc-link-checker

      - name: Run adocx (capture report, non-blocking)
        run: |
          adocx check-links . --output broken_links.json || true

      - name: Display broken links in logs
        run: |
          if [ -s broken_links.json ] && [ "$(cat broken_links.json)" != "{}" ]; then
            echo "⚠️ Broken links detected:"
            echo "--------------------------------"
            cat broken_links.json
            echo "--------------------------------"
          else
            echo "✅ No broken links found"
          fi

      - name: Publish summary to GitHub Actions UI
        run: |
          if [ -s broken_links.json ] && [ "$(cat broken_links.json)" != "{}" ]; then
            {
              echo "## ⚠️ Broken links detected"
              echo ""
              echo "The following broken links were found during the documentation check:"
              echo ""
              echo '```json'
              cat broken_links.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ✅ No broken links found" >> "$GITHUB_STEP_SUMMARY"
          fi
